version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ "$AWS_BRANCH" = "admin" ]; then
            cd admin && npm ci
          else
            cd main && npm ci
          fi
    build:
      commands:
        - |
          if [ "$AWS_BRANCH" = "admin" ]; then
            cd admin && npm run build && cp -r dist ../dist
          else
            cd main && npm run build && cp -r dist ../dist
          fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  redirects:
    - source: '</^[^.]+$|[.](?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
      target: /index.html
      status: 200
