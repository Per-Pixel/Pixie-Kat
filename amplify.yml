version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          set -e
          if [ "$AWS_BRANCH" = "admin" ]; then APP_ROOT=admin; else APP_ROOT=main; fi
          # Force relative API URLs so the Amplify proxy handles /api/* (avoids mixed content)
          export VITE_API_BASE_URL=""
          if [ "$AWS_BRANCH" = "admin" ]; then export VITE_API_BASE_URL="/api"; fi
          # Storefront media from Amplify CDN (not Supabase storage egress)
          if [ "$AWS_BRANCH" != "admin" ]; then export VITE_PUBLIC_MEDIA_ORIGIN=site; fi
          if [ "$AWS_BRANCH" != "admin" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            (cd main/server && npm ci)
            node scripts/sync-public-media-from-supabase.mjs
          fi
          (cd "$APP_ROOT" && npm ci)
    build:
      commands:
        - |
          set -e
          if [ "$AWS_BRANCH" = "admin" ]; then APP_ROOT=admin; else APP_ROOT=main; fi
          # Force relative API URLs so the Amplify proxy handles /api/* (avoids mixed content)
          export VITE_API_BASE_URL=""
          if [ "$AWS_BRANCH" = "admin" ]; then export VITE_API_BASE_URL="/api"; fi
          if [ "$AWS_BRANCH" != "admin" ]; then export VITE_PUBLIC_MEDIA_ORIGIN=site; fi
          (cd "$APP_ROOT" && npm run build)
          rm -rf dist
          mv "$APP_ROOT/dist" dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  redirects:
    - source: /api/<*>
      target: https://c4pmcbw502.execute-api.ap-south-1.amazonaws.com/prod/api/<*>
      status: 200
    - source: </^[^.]+$|[.](?!(css|gif|ico|jpg|jpeg|js|json|map|mp3|mp4|ogg|opus|png|svg|txt|wav|webm|webp|woff|woff2|ttf)$)([^.]+$)/>
      target: /index.html
      status: 200
