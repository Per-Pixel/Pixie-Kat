version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          set -e
          if [ "$AWS_BRANCH" = "admin" ]; then APP_ROOT=admin; else APP_ROOT=main; fi
          (cd "$APP_ROOT" && npm ci)
    build:
      commands:
        - |
          set -e
          if [ "$AWS_BRANCH" = "admin" ]; then APP_ROOT=admin; else APP_ROOT=main; fi
          (cd "$APP_ROOT" && npm run build)
          rm -rf dist
          mv "$APP_ROOT/dist" dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  redirects:
    - source: '</^[^.]+$|[.](?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
      target: /index.html
      status: 200
