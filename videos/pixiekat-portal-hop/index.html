          <span data-hf-id="hf-g5vb" class="s7w">Instant</span><span data-hf-id="hf-5627" class="s7w">Gaming</span><span data-hf-id="hf-qg7c" class="s7w">Credits</span><span data-hf-id="hf-sn6u" class="s7w">—</span><span data-hf-id="hf-mjr4" class="s7w">Fast,</span><span data-hf-id="hf-9chh" class="s7w">Secure,</span><span data-hf-id="hf-uxo0" class="s7w">Affordable</span>
        </div>
        <div data-hf-id="hf-gyfj" id="s7cta">
          <div class="s7ring"></div>
          <div class="s7ring"></div>
          <div class="s7ring"></div>
          <div data-hf-id="hf-j63a" id="s7pill">
            <span>TOP UP NOW</span>
            <svg id="s7arrow" viewBox="0 0 24 24"><path d="M4 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </div>
        </div>
        <svg data-hf-id="hf-6o47" width="0" height="0" style="position: absolute">
          <defs data-hf-id="hf-mh0t">
            <clippath data-hf-id="hf-2mds" id="pkclip" clipPathUnits="userSpaceOnUse">
              <text data-hf-id="hf-wo0n" x="960" y="650" text-anchor="middle" font-family="display" font-size="360" textLength="1650" lengthAdjust="spacingAndGlyphs">PIXIEKAT</text>
            </clippath>
          </defs>
        </svg>
      </div>

      <!-- overlays -->
      <div data-hf-id="hf-ha0n" id="tunnel" class="layer">
        <video data-hf-id="hf-4ydx" id="v-tunnel" class="clip fill" src="assets/broll/neon_tunnel_mono.mp4" muted playsinline data-start="1.55" data-duration="2.45" data-media-start="0"></video>
        <div data-hf-id="hf-ucqf" id="tunnel-tint" class="layer"></div>
      </div>
      <div data-hf-id="hf-63z3" id="pips"><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i><i data-hf-id="hf-ylp6"></i><i data-hf-id="hf-0l8b"></i></div>
      <div data-hf-id="hf-48ym" id="grain" class="layer"><div data-hf-id="hf-0qtj" class="grain-texture"></div></div>

      <!-- audio -->
      <audio data-hf-id="hf-z6aw" id="music" src="assets/music/mixkit-night-terrors.mp3" data-start="0" data-duration="15" data-media-start="57.605" data-volume="0.8" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.8},{&quot;t&quot;:14.3,&quot;v&quot;:0.8},{&quot;t&quot;:15,&quot;v&quot;:0}]}]}"></audio>
      <audio data-hf-id="hf-xzkw" id="sfx-dive" src="assets/sfx/whoosh_in_1490.wav" data-start="1.09" data-volume="0.55"></audio>
      <audio data-hf-id="hf-g8v2" id="sfx-roll" src="assets/sfx/roll_whoosh_168.wav" data-start="3.42" data-volume="0.5"></audio>
      <audio data-hf-id="hf-0fs4" id="sfx-whip" src="assets/sfx/whip_1491.wav" data-start="5.37" data-volume="0.6"></audio>
      <audio data-hf-id="hf-hi64" id="sfx-coin" src="assets/sfx/coin_flip_2038.wav" data-start="6.88" data-volume="0.5"></audio>
      <audio data-hf-id="hf-wkk3" id="sfx-glitch" src="assets/sfx/glitch_hit_2299.wav" data-start="7.325" data-volume="0.6"></audio>
      <audio data-hf-id="hf-1ti9" id="sfx-out" src="assets/sfx/whoosh_out_1472.wav" data-start="9.16" data-volume="0.6"></audio>
      <audio data-hf-id="hf-0au8" id="sfx-pop" src="assets/sfx/ui_pop_2356.wav" data-start="12.84" data-volume="0.6"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Portal centres: P = the O counter, C = frame centre (Diamond), Q = Token window, Z = inside the A.
      const P = [830, 420];
      const C = [960, 540];
      const Q = [1240, 540];
      const Z = [1460, 415];
      const W = [960, 524];
      const HOLE = 48;
      const DIVE = 28;
      const px = (p) => `${p[0]}px ${p[1]}px`;
      const circ = (r, c) => `circle(${r}px at ${px(c)})`;
      const dia = (h) => `polygon(${C[0]}px ${C[1] - h}px, ${C[0] + h}px ${C[1]}px, ${C[0]}px ${C[1] + h}px, ${C[0] - h}px ${C[1]}px)`;
      const ft = (t, from, to, at) => tl.fromTo(t, from, { ...to, immediateRender: false }, at);

      // ---------- initial states ----------
      gsap.set(["#s3rot", "#s4whip", "#s5door", "#s6"], { autoAlpha: 0 });
      gsap.set(["#s1label", ".hl", "#s1o", "#s2title", "#s2chip", "#s3title", "#s3chip", "#s4title", "#s4chip", "#s5title", "#s5chip", "#s6label", "#s6glow", "#s7logo", ".s7w", "#s7pill", ".s7ring", "#s6ink"], { autoAlpha: 0 });
      gsap.set("#s1cam", { transformOrigin: "0px 0px" });
      gsap.set(".hl", { y: 150 });
      gsap.set("#s1o", { scale: 0 });
      gsap.set("#s2door", { clipPath: circ(0, P) });
      gsap.set("#s2cam", { transformOrigin: px(P) });
      gsap.set(["#s2roll", "#s3rot"], { transformOrigin: px(C) });
      gsap.set("#s2card", { x: -360, y: -11, scale: 2.02, rotationY: 0, rotationX: 0, transformPerspective: 1600 });
      gsap.set("#s2title", { scale: 1.4 });
      gsap.set("#s2chip", { y: 30 });
      gsap.set("#s3door", { clipPath: dia(0) });
      gsap.set("#s3stroke", { scale: 0 });
      gsap.set("#s3world", { scale: 1.3 });
      gsap.set("#s3cards", { x: 260 });
      gsap.set("#s3raiden", { x: 700 });
      gsap.set("#s3title", { x: 120 });
      gsap.set("#s3chip", { scale: 0 });
      gsap.set(["#s3rot", "#s4whip"], { filter: "blur(0px)" });
      gsap.set("#s4whip", { x: 1920 });
      gsap.set("#s4world", { y: 140 });
      gsap.set("#s4title", { x: -80 });
      gsap.set("#s4chip", { scale: 0.6 });
      gsap.set("#s4coin", { scale: 0, rotationY: 0, transformPerspective: 1400 });
      gsap.set("#s5door", { clipPath: circ(330, Q), rotationY: -90, transformOrigin: px(Q), transformPerspective: 1400 });
      gsap.set("#s5world", { x: 36 });
      gsap.set("#s5vids", { scale: 1.2 });
      gsap.set("#s5panel", { clipPath: "inset(0px 0px 0px 1060px)" });
      gsap.set("#s5title", { scale: 1.5, textShadow: "-18px 0px 0px rgba(255,45,85,0.9), 18px 0px 0px rgba(45,225,255,0.9)" });
      gsap.set("#s5chip", { scale: 0.6 });
      gsap.set("#s6cam", { transformOrigin: px(Z), scale: 32 });
      gsap.set("#s6lock", { transformOrigin: "960px 524px" });
      gsap.set("#s6dark", { clipPath: circ(0, W) });
      gsap.set("#s7logo", { scale: 0 });
      gsap.set(".s7w", { y: 24 });
      gsap.set(["#s7pill", ".s7ring"], { xPercent: -50, yPercent: -50 });
      gsap.set("#s7pill", { scale: 0.6 });
      gsap.set("#tunnel", { opacity: 0 });
      gsap.set("#pips i", { backgroundColor: "rgba(139,109,255,0)" });

      // ---------- 01 store: words land in the silent hole, dive through the O on the riser ----------
      tl.to("#s1label", { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.15);
      tl.to(".hl", { y: 0, autoAlpha: 1, duration: 0.45, ease: "power4.out", stagger: 0.08 }, 0.1);
      tl.to("#s1o", { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.25);
      ft("#s2door", { clipPath: circ(0, P) }, { clipPath: circ(HOLE, P), duration: 0.4, ease: "back.out(1.8)" }, 0.25);
      tl.to("#s1cam", { scale: DIVE, duration: 0.9, ease: "power3.in" }, 0.95);
      ft("#s2door", { clipPath: circ(HOLE, P) }, { clipPath: circ(HOLE * DIVE, P), duration: 0.9, ease: "power3.in" }, 0.95);
      tl.to("#s2cam", { scale: 1.25, duration: 0.9, ease: "power3.in" }, 0.95);
      tl.set("#s1", { autoAlpha: 0 }, 1.85);
      tl.set("#s2door", { clipPath: "none" }, 1.85);

      // ---------- 02 mlbb: land, pull back to the tilted card on the 2.31 slam ----------
      tl.to("#s2cam", { scale: 1.32, duration: 0.46, ease: "power2.out" }, 1.85);
      tl.to("#s2cam", { scale: 1, duration: 0.6, ease: "power4.out" }, 2.31);
      tl.to("#s2card", { x: 0, y: 0, scale: 1, rotationY: -14, rotationX: 4, duration: 0.6, ease: "power4.out" }, 2.31);
      tl.to("#s2title", { scale: 1, autoAlpha: 1, duration: 0.18, ease: "power4.out" }, 2.31);
      tl.to("#s2chip", { y: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 2.5);

      // ---------- 02 -> 03: Diamond doorway springs open, rolling dive crosses on 3.70 ----------
      tl.set("#s3rot", { autoAlpha: 1 }, 2.78);
      ft("#s3door", { clipPath: dia(0) }, { clipPath: dia(120), duration: 0.34, ease: "back.out(1.7)" }, 2.78);
      tl.to("#s3stroke", { scale: 1, duration: 0.34, ease: "back.out(1.7)" }, 2.78);
      tl.to("#s2roll", { scale: 6, rotation: 60, duration: 0.46, ease: "power3.in" }, 3.24);
      tl.to("#s3rot", { rotation: 60, duration: 0.46, ease: "power3.in" }, 3.24);
      ft("#s3door", { clipPath: dia(120) }, { clipPath: dia(1650), duration: 0.46, ease: "power3.in" }, 3.24);
      tl.to("#s3stroke", { scale: 13.75, duration: 0.46, ease: "power3.in" }, 3.24);
      tl.set("#s2door", { autoAlpha: 0 }, 3.7);
      tl.set("#s3door", { clipPath: "none" }, 3.7);
      tl.set("#s3stroke", { autoAlpha: 0 }, 3.7);

      // ---------- 03 genshin: roll resolves level, flight decelerates into focus ----------
      tl.to("#s3rot", { rotation: 0, duration: 0.75, ease: "power4.out" }, 3.7);
      tl.to("#s3world", { scale: 1, duration: 0.85, ease: "power4.out" }, 3.7);
      tl.to("#s3cards", { x: 0, duration: 1.0, ease: "power4.out" }, 3.7);
      tl.to("#s3raiden", { x: 0, duration: 1.1, ease: "power4.out" }, 3.7);
      tl.to("#s3title", { x: 0, autoAlpha: 1, duration: 0.6, ease: "power4.out" }, 3.85);
      tl.to("#s3chip", { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)" }, 4.63);

      // ---------- 03 -> 04: whip on one strip, blur peaks at the crossing ----------
      tl.set("#s4whip", { autoAlpha: 1 }, 5.32);
      tl.to("#s3rot", { x: -1920, duration: 0.48, ease: "power3.inOut" }, 5.32);
      tl.to("#s4whip", { x: 0, duration: 0.48, ease: "power3.inOut" }, 5.32);
      tl.to(["#s3rot", "#s4whip"], { keyframes: [{ filter: "blur(18px)", duration: 0.24, ease: "power2.in" }, { filter: "blur(0px)", duration: 0.24, ease: "power2.out" }] }, 5.32);
      tl.set("#s3rot", { autoAlpha: 0 }, 5.81);

      // ---------- 04 hok: crane landing, Token window opens, coin flip ----------
      tl.to("#s4world", { y: 0, duration: 0.8, ease: "power3.out" }, 5.45);
      tl.to("#s4title", { x: 0, autoAlpha: 1, duration: 0.5, ease: "power4.out" }, 5.75);
      tl.to("#s4coin", { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 6.01);
      tl.to("#s4chip", { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2)" }, 6.2);
      tl.to("#s4coin", { rotationY: 90, duration: 0.16, ease: "power2.in" }, 6.94);

      // ---------- 04 -> 05: back face swings in and floods the frame by 7.40 ----------
      tl.set("#s5door", { autoAlpha: 1 }, 7.1);
      tl.to("#s5door", { rotationY: 0, duration: 0.15, ease: "power2.out" }, 7.1);
      ft("#s5door", { clipPath: circ(330, Q) }, { clipPath: circ(1460, Q), duration: 0.3, ease: "power2.in" }, 7.1);
      tl.set("#s5door", { clipPath: "none" }, 7.4);
      tl.set("#s4whip", { autoAlpha: 0 }, 7.42);

      // ---------- 05 bgmi: chromatic slam, eighth-note stutters, clip floods the frame ----------
      tl.to("#s5world", { x: 0, duration: 0.3, ease: "power4.out" }, 7.4);
      tl.to("#s5title", { scale: 1, autoAlpha: 1, duration: 0.2, ease: "power4.out" }, 7.4);
      tl.to("#s5title", { textShadow: "0px 0px 0px rgba(255,45,85,0), 0px 0px 0px rgba(45,225,255,0)", duration: 0.3, ease: "power2.out" }, 7.42);
      tl.to("#s5chip", { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, 7.63);
      [7.63, 7.86, 8.1].forEach((t) => ft("#s5vids", { scale: 1.3 }, { scale: 1.2, duration: 0.2, ease: "power3.out" }, t));
      ft("#s5panel", { clipPath: "inset(0px 0px 0px 1060px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.45, ease: "power3.inOut" }, 8.3);
      tl.to("#s5edge", { x: -1060, autoAlpha: 0, duration: 0.45, ease: "power3.inOut" }, 8.3);
      tl.to(["#s5title", "#s5chip"], { y: -70, autoAlpha: 0, duration: 0.2, ease: "power2.in" }, 8.55);
      tl.set("#s6", { autoAlpha: 1 }, 8.75);
      tl.set("#s5door", { autoAlpha: 0 }, 8.8);

      // ---------- 06 every world: creep out of the A in the dropout, snap back on the 9.25 re-hit ----------
      tl.to("#s6cam", { scale: 24, duration: 0.5, ease: "power2.in" }, 8.75);
      tl.to("#s6cam", { scale: 1, duration: 0.95, ease: "power4.out" }, 9.25);
      tl.to("#s6label", { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 9.9);
      ft("#s6dark", { clipPath: circ(0, W) }, { clipPath: circ(1150, W), duration: 0.46, ease: "power2.inOut" }, 10.64);
      tl.to("#s6ink", { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 10.8);
      tl.to("#pips", { autoAlpha: 0, duration: 0.3 }, 10.64);
      tl.to("#s6label", { autoAlpha: 0, duration: 0.2, ease: "power2.in" }, 10.44);

      // ---------- 07 cta: wordmark rises into the lockup, pill presses on 12.95 ----------
      tl.to("#s6lock", { x: 70, y: -144, scale: 0.42, duration: 0.55, ease: "power3.inOut" }, 11.1);
      tl.to("#s6glow", { autoAlpha: 0.7, duration: 0.8, ease: "power2.out" }, 11.3);
      tl.to("#s7logo", { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, 11.3);
      tl.to(".s7w", { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out", stagger: 0.05 }, 11.5);
      tl.to("#s7pill", { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(2)" }, 11.75);
      tl.to("#s7pill", { scale: 0.92, duration: 0.08, ease: "power2.in" }, 12.87);
      tl.to("#s7pill", { scale: 1, duration: 0.5, ease: "back.out(3)" }, 12.95);
      tl.to("#s7arrow", { x: 12, duration: 0.08, ease: "power2.in" }, 12.87);
      tl.to("#s7arrow", { x: 0, duration: 0.5, ease: "back.out(3)" }, 12.95);
      ft(".s7ring", { scale: 1, autoAlpha: 0.95 }, { scale: 1.9, autoAlpha: 0, duration: 0.75, ease: "power2.out", stagger: 0.12 }, 12.95);
      tl.to("#s6glow", { opacity: 1, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 13.0);

      // ---------- overlays: tunnel flashes on the crossings, world-counter pips ----------
      [1.85, 3.7].forEach((t) => {
        tl.to("#tunnel", { opacity: 0.35, duration: 0.15, ease: "power2.in" }, t - 0.15);
        tl.to("#tunnel", { opacity: 0, duration: 0.2, ease: "power2.out" }, t);
      });
      const pips = gsap.utils.toArray("#pips i");
      [1.85, 3.7, 5.55, 7.4].forEach((t, i) => {
        tl.to(pips[i], { backgroundColor: "rgba(139,109,255,1)", scale: 1.35, duration: 0.12, ease: "power2.out" }, t);
        tl.to(pips[i], { scale: 1, duration: 0.25, ease: "power2.out" }, t + 0.12);
      });
      tl.to(pips, { scale: 1.5, duration: 0.1, ease: "power2.out" }, 8.1);
      tl.to(pips, { scale: 1, duration: 0.3, ease: "power2.out" }, 8.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
